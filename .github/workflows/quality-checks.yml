name: Site quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check HTML, links, sitemap, and inline JavaScript
        run: python scripts/check_site.py
