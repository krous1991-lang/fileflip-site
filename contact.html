<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact FileFlip for support, questions and feedback.">
  <title>Contact Us | FileFlip</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fc;
      color: #20243a;
    }
    header {
      padding: 25px 7%;
      background: linear-gradient(120deg, #171b50, #5542d8);
      color: white;
    }
    .logo { font-size: 30px; font-weight: 800; }
    main {
      max-width: 760px;
      margin: 65px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 42px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 40px #20243a12;
    }
    .icon { font-size: 48px; }
    h1 { font-size: 36px; margin: 15px 0; }
    p {
      color: #687086;
      font-size: 17px;
      line-height: 1.8;
    }
    .email {
      display: inline-block;
      margin: 20px 0;
      padding: 16px 24px;
      background: #f0edff;
      border-radius: 14px;
      color: #5140c9;
      font-weight: bold;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .back {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 25px;
      background: #5140c9;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #777d91;
    }
    @media(max-width: 600px) {
      main { margin: 30px auto; }
      .card { padding: 32px 20px; }
      h1 { font-size: 29px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">FileFlip</div>
  </header>

  <main>
    <section class="card">
      <div class="icon">💬</div>
      <h1>Get in Touch</h1>
      <p>
        Have a question, need help, or want to share feedback?
        We'd love to hear from you.
      </p>
      <p>Our support contact:</p>
      <a class="email" href="mailto:Simonako080591@gmail.com">
        Simonako080591@gmail.com
      </a>
      <p>We're happy to help make your FileFlip experience better.</p>
      <a class="back" href="index.html">← Back to FileFlip</a>
    </section>
  </main>

  <footer>© 2026 FileFlip. All rights reserved.</footer>
</body>
</html>
